services:
  shareit-db:
    image: postgres:16-alpine
    container_name: shareit-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: shareit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - shareit-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shareit"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  shareit-postgres-data:
